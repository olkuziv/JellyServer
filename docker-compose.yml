name: jellyserver

services:
  jellyserver:
    build: .
    image: jellyserver:latest
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "${HTTP_PORT:-80}:8096"
      - "7359:7359/udp"   # client auto-discovery
    environment:
      ConnectionStrings__Postgres: "Host=${DB_POSTGRES_HOST:-postgres};Username=${DB_POSTGRES_USERNAME:-jelly};Password=${DB_POSTGRES_PASSWORD:-jelly};Database=${DB_POSTGRES_DATABASE:-jelly};Maximum Pool Size=50;No Reset On Close=true"
      ConnectionStrings__Redis: "${REDIS_REDIS_HOST:-redis}:6379,abortConnect=false"
      JellyServer__Name: "${SERVER_NAME:-JellyServer}"
      JellyServer__Playback__StrmMode: "${STRM_MODE:-proxy}"
      JellyServer__PublicUrl: "${PUBLIC_URL:-http://localhost}"
      # TheMovieDb metadata and artwork (an API key or a read access token from themoviedb.org); empty = off
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      # Log every request (method, path, status, ms). Set to Information to quiet it down.
      Logging__LogLevel__JellyServer.Api.RequestLoggingMiddleware: "${REQUEST_LOG_LEVEL:-Debug}"
    volumes:
      - jelly-data:/data
      - ./config:/app/config:ro         # config/appsettings.json: optional overrides
      - ${MEDIA_PATH:-E:/NAS/media}:/media:ro
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jelly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jelly}
      POSTGRES_DB: jelly
    # Tuned for a read-heavy catalogue of a few hundred thousand rows.
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c random_page_cost=1.1
        -c max_connections=200
        -c log_min_duration_statement=500
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jelly -d jelly"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  jelly-data:
  pg-data:
